<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found - Interior Design Studio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            width: 90%;
            max-width: 650px;
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .error-code {
            font-size: 100px;
            font-weight: bold;
            color: #b88a44;
            line-height: 1;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            color: #222;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .home-btn {
            display: inline-block;
            padding: 14px 30px;
            background: #b88a44;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #956d32;
            transform: translateY(-2px);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="error-container">

        <div class="icon">🏠</div>

        <div class="error-code">404</div>

        <h1>Page Not Found</h1>

        <p>
            Sorry, the page you are looking for does not exist
            or may have been moved.
        </p>

        <a href="/" class="home-btn">
            ← Back to Home
        </a>

    </div>

</body>
</html>
